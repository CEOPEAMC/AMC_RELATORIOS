<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a14; --surface: #13131f; --surface2: #1b1b2e;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #eeeef5; --text2: rgba(238,238,245,0.55); --text3: rgba(238,238,245,0.28);
    --accent: #7c6af7; --accent2: #a99bff; --accent-bg: rgba(124,106,247,0.12);
  }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: -30vh; left: 50%;
    transform: translateX(-50%); width: 70vw; height: 70vw;
    background: radial-gradient(ellipse, rgba(124,106,247,0.07) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }
  .app-wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; }

  /* Header */
  header {
    padding: 20px 20px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo-mark { display: flex; align-items: center; gap: 11px; }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent-bg); border: 0.5px solid rgba(124,106,247,0.3);
    border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .logo-text { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .header-count {
    font-family: 'DM Sans', monospace; font-size: 11px; color: var(--text3);
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; padding: 4px 11px;
  }
  .view-toggle {
    display: flex; background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .view-btn {
    width: 32px; height: 28px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s; color: var(--text3); border: none; background: none;
  }
  .view-btn.active { background: var(--accent); color: white; }
  .view-btn svg { width: 14px; height: 14px; }

  /* Search */
  .search-wrap { padding: 14px 20px 0; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: 0.3; pointer-events: none; }
  .search-input {
    width: 100%; background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 13px; padding: 11px 14px 11px 38px; color: var(--text);
    font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none;
    transition: border-color 0.2s, background 0.2s; -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: rgba(124,106,247,0.45); background: var(--surface2); }

  /* Categories */
  .cats { display: flex; gap: 7px; padding: 13px 20px 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .cats::-webkit-scrollbar { display: none; }
  .cat-pill {
    background: var(--surface); border: 0.5px solid var(--border); color: var(--text2);
    font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 20px;
    cursor: pointer; white-space: nowrap; transition: all 0.18s; user-select: none;
  }
  .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cat-pill:active { transform: scale(0.95); }

  /* Count row */
  .count-row { padding: 12px 20px 3px; font-size: 11px; color: var(--text3); letter-spacing: 0.3px; }

  /* GRID VIEW */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 11px; padding: 3px 20px 100px;
  }
  .card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 20px; padding: 22px 14px 17px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 11px;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    user-select: none; position: relative; overflow: hidden; text-decoration: none; color: inherit;
  }
  .card::after {
    content: ''; position: absolute; inset: 0; border-radius: 20px;
    background: radial-gradient(ellipse at 50% -10%, var(--card-accent, #7c6af7), transparent 70%);
    opacity: 0; transition: opacity 0.25s;
  }
  .card:hover { border-color: var(--border2); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
  .card:hover::after { opacity: 0.12; }
  .card:active { transform: scale(0.96) translateY(0); box-shadow: none; }
  .card-ico {
    width: 62px; height: 62px; border-radius: 17px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; position: relative; z-index: 1; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  .card:hover .card-ico { transform: scale(1.07); }
  .card-name {
    font-size: 12px; font-weight: 600; color: var(--text);
    text-align: center; line-height: 1.35; max-height: 52px; overflow: hidden;
    position: relative; z-index: 1; letter-spacing: 0.2px;
  }
  .card-tag {
    font-size: 10px; color: var(--text3); background: rgba(255,255,255,0.05);
    border: 0.5px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 2px 9px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    position: relative; z-index: 1;
  }

  /* LIST VIEW */
  .list { display: none; flex-direction: column; gap: 6px; padding: 3px 20px 100px; }
  .list-item {
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px;
    padding: 13px 16px; cursor: pointer; display: flex; align-items: center; gap: 13px;
    transition: border-color 0.18s, background 0.18s; text-decoration: none; color: inherit;
  }
  .list-item:hover { border-color: var(--border2); background: var(--surface2); }
  .list-item:active { transform: scale(0.99); }
  .list-ico {
    width: 46px; height: 46px; border-radius: 13px; display: flex;
    align-items: center; justify-content: center; font-size: 23px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .list-info { flex: 1; min-width: 0; }
  .list-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-cat { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .list-arrow { color: var(--text3); flex-shrink: 0; }

  /* View mode classes */
  body.view-list .grid { display: none; }
  body.view-list .list { display: flex; }

  /* Empty */
  .empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-ico { font-size: 44px; display: block; margin-bottom: 14px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(30,30,48,0.95); backdrop-filter: blur(12px);
    border: 0.5px solid var(--border2); border-radius: 20px;
    padding: 10px 20px; font-size: 13px; color: var(--text);
    z-index: 999; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

let activeCat = 'Todos';
let currentView = 'grid';

function setView(v) {
  currentView = v;
  document.body.classList.toggle('view-list', v === 'list');
  document.getElementById('btnGrid').classList.toggle('active', v === 'grid');
  document.getElementById('btnList').classList.toggle('active', v === 'list');
}
function getCategories() { return ['Todos', ...new Set(LINKS_DATA.map(l => l.category).filter(Boolean))]; }
function filtered() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  return LINKS_DATA.filter(l => {
    const matchCat = activeCat === 'Todos' || l.category === activeCat;
    const matchQ = !q || l.name.toLowerCase().includes(q) || (l.category||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}
function getIcoBg(color) {
  if (!color) return '#7c6af733';
  if (color.startsWith('linear')) return color;
  return color + '44';
}
function renderCats() {
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = getCategories().map(c => `<div class="cat-pill ${c===activeCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</div>`).join('');
  tabs.onclick = function(ev) {
    const el = ev.target.closest('.cat-pill');
    if (el) { activeCat = el.dataset.cat; renderCats(); render(); }
  };
}
function render() {
  const fl = filtered();
  const grid = document.getElementById('grid');
  const listEl = document.getElementById('listView');
  document.getElementById('headerCount').textContent = LINKS_DATA.length + ' link' + (LINKS_DATA.length!==1?'s':'');
  document.getElementById('countRow').textContent = fl.length + ' relatório' + (fl.length!==1?'s':'');
  const accentColor = c => c && !c.startsWith('linear') ? c : '#7c6af7';
  if (!fl.length) {
    grid.innerHTML = '<div class="empty"><span class="empty-ico">🔍</span><p>Nenhum relatório encontrado.</p></div>';
    listEl.innerHTML = '';
    return;
  }
  grid.innerHTML = fl.map(l => `
    <a class="card" style="--card-accent:${accentColor(l.color)}" href="${esc(l.url)}" target="_blank" rel="noopener" onclick="showToast('Abrindo '+${JSON.stringify(l.name)}+'…')">
      <div class="card-ico" style="background:${getIcoBg(l.color)}">${l.emoji}</div>
      <div class="card-name">${esc(l.name)}</div>
      ${l.category?'<div class="card-tag">'+esc(l.category)+'</div>':''}
    </a>`).join('');
  listEl.innerHTML = fl.map(l => `
    <a class="list-item" href="${esc(l.url)}" target="_blank" rel="noopener" onclick="showToast('Abrindo '+${JSON.stringify(l.name)}+'…')">
      <div class="list-ico" style="background:${getIcoBg(l.color)}">${l.emoji}</div>
      <div class="list-info">
        <div class="list-name">${esc(l.name)}</div>
        ${l.category?'<div class="list-cat">'+esc(l.category)+'</div>':''}
      </div>
      <div class="list-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>`).join('');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._to); t._to = setTimeout(()=>t.classList.remove('show'), 2000);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
renderCats(); render();
</script>
